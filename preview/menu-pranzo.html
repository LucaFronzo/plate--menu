<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,600&family=Oswald:wght@500;600&display=swap">
<style>
/*
 * Plateform — skin "Apple" per il menù digitale
 * ------------------------------------------------------------------
 * Tutto è racchiuso in .pfm e ogni classe ha il prefisso pfm-, così la
 * skin convive con Bootstrap e con gli stili esistenti della piattaforma.
 *
 * I colori del locale NON si scrivono qui: menu-skin.js li calcola dai due
 * colori custom (primario e accento) e li imposta come variabili su .pfm.
 * I valori qui sotto sono solo il fallback (i colori di esempio).
 * Vedi README.md per l'elenco completo dei token.
 */

/* ---------- Token ---------- */
.pfm {
  /* colori del locale (calcolati da JS) */
  --pfm-h: 4;                     /* tinta del primario: colora leggermente i neutri */
  --pfm-band: #6E1410;            /* fondo della testata = colore primario */
  --pfm-band-ink: #F5A81C;        /* logo e nome sulla testata = colore d'accento, se leggibile */
  --pfm-band-text: #FBE9D6;       /* testi sulla testata */
  --pfm-band-sub: #EBCDB4;        /* testi secondari sulla testata */
  --pfm-accent: #8A1C15;          /* elementi attivi su fondo chiaro (pillola corrente, Novità, pulsanti) */
  --pfm-on-accent: #FFFFFF;       /* testo sopra --pfm-accent */
  --pfm-soft: #FBEFD6;            /* fondo tenue d'accento (etichetta Specialità, indice corrente) */
  --pfm-soft-ink: #7A4A00;        /* testo su --pfm-soft */

  /* neutri (derivati dalla tinta del primario) */
  --pfm-ground: hsl(var(--pfm-h) 20% 96%);
  --pfm-surface: #FFFFFF;
  --pfm-ink: hsl(var(--pfm-h) 22% 10%);
  --pfm-ink-2: hsl(var(--pfm-h) 7% 32%);
  --pfm-ink-3: hsl(var(--pfm-h) 6% 40%);
  --pfm-line: hsl(var(--pfm-h) 14% 90%);
  --pfm-chip: hsl(var(--pfm-h) 16% 92%);

  /* colori di significato: fissi, non dipendono dal locale */
  --pfm-hot: #B42318;             /* Piccante, allergeni esclusi */
  --pfm-frost: #1F5FA8;           /* surgelato */
  --pfm-warn: #9A3412;            /* allergeni non indicati */

  /* materiali e profondità */
  --pfm-material: hsla(var(--pfm-h), 20%, 96%, 0.86);
  --pfm-scrim: rgba(20, 10, 8, 0.44);
  --pfm-shadow: 0 -8px 40px rgba(40, 15, 10, 0.18);

  /* caratteri */
  --pfm-f-display: "Oswald", "Arial Narrow", "Helvetica Neue", sans-serif;
  --pfm-f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pfm-f-classic: "Newsreader", Georgia, "Times New Roman", serif;

  /* stile dei titoli (nome del locale, categorie): scelto dal locale con titleStyle */
  --pfm-title-font: var(--pfm-f-body);   /* Neutro (default) */
  --pfm-title-weight: 700;
  --pfm-title-case: none;
  --pfm-title-track: -0.02em;
  --pfm-title-lh: 1.05;

  /* misure */
  --pfm-max: 600px;
  --pfm-gutter: max(16px, env(safe-area-inset-left, 0px));
  --pfm-gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --pfm-rail-h: 64px;             /* altezza reale della barra, misurata da JS */
}
.pfm.pfm-title-sign { --pfm-title-font: var(--pfm-f-display); --pfm-title-weight: 600; --pfm-title-case: uppercase; --pfm-title-track: 0.005em; --pfm-title-lh: 0.95; }
.pfm.pfm-title-classic { --pfm-title-font: var(--pfm-f-classic); --pfm-title-weight: 600; --pfm-title-case: none; --pfm-title-track: -0.01em; --pfm-title-lh: 1.02; }
.pfm.pfm-dark {
  --pfm-ground: hsl(var(--pfm-h) 10% 7%);
  --pfm-surface: hsl(var(--pfm-h) 9% 11%);
  --pfm-ink: hsl(var(--pfm-h) 18% 94%);
  --pfm-ink-2: hsl(var(--pfm-h) 8% 74%);
  --pfm-ink-3: hsl(var(--pfm-h) 6% 62%);
  --pfm-line: hsl(var(--pfm-h) 8% 19%);
  --pfm-chip: hsl(var(--pfm-h) 9% 17%);
  --pfm-hot: #FF8A80;
  --pfm-frost: #8CC4FF;
  --pfm-warn: #FDBA74;
  --pfm-material: hsla(var(--pfm-h), 10%, 7%, 0.84);
  --pfm-scrim: rgba(0, 0, 0, 0.6);
  --pfm-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

/* ---------- Base e reset locale (non tocca il resto del sito) ---------- */
.pfm { min-height: 100vh; background: var(--pfm-ground); color: var(--pfm-ink); font: 400 1rem/1.5 var(--pfm-f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
.pfm *, .pfm *::before, .pfm *::after { box-sizing: border-box; }
.pfm [hidden] { display: none !important; }
/* reset a priorità bassa (:where) così le classi pfm- vincono sempre */
.pfm :where(h1, h2, h3, p, ul) { margin: 0; }
.pfm :where(ul) { padding: 0; list-style: none; }
.pfm :where(button, input) { font: inherit; color: inherit; margin: 0; }
.pfm :where(button) { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
.pfm :where(a) { color: inherit; text-underline-offset: 3px; }
.pfm ::selection { background: var(--pfm-band-ink); color: var(--pfm-band); }
.pfm :focus-visible { outline: 2px solid var(--pfm-accent); outline-offset: 2px; border-radius: 10px; }
.pfm .pfm-i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pfm-wrap { max-width: var(--pfm-max); margin: 0 auto; padding-left: var(--pfm-gutter); padding-right: var(--pfm-gutter-r); }
.pfm-tap { transition: transform 110ms cubic-bezier(.2, .8, .2, 1), background 140ms, color 140ms; }
.pfm-tap:active { transform: scale(0.95); transition-duration: 40ms; }

/* ---------- Testata ---------- */
.pfm-band { background: var(--pfm-band); color: var(--pfm-band-text); }
.pfm-band > .pfm-wrap { padding-block: 14px 24px; }
.pfm-band-top { display: flex; justify-content: flex-end; gap: 8px; }
.pfm-pill { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; font-size: 0.9rem; font-weight: 600; text-decoration: none; }
.pfm-pill.pfm-ghost { background: color-mix(in srgb, var(--pfm-band-text) 14%, transparent); color: var(--pfm-band-text); }
.pfm-pill.pfm-solid { background: var(--pfm-band-ink); color: var(--pfm-band); }
.pfm-pill .pfm-i { width: 18px; height: 18px; }
.pfm-id { display: flex; gap: 16px; align-items: center; margin-top: 6px; }
.pfm-logo { flex: none; width: 66px; aspect-ratio: var(--pfm-logo-ratio, 1); }
.pfm-logo.pfm-tint { background: var(--pfm-band-ink); -webkit-mask: var(--pfm-logo) center / contain no-repeat; mask: var(--pfm-logo) center / contain no-repeat; }
.pfm-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.pfm-id h1 { font: var(--pfm-title-weight) clamp(1.9rem, 4vw + 1rem, 2.6rem)/var(--pfm-title-lh) var(--pfm-title-font); text-transform: var(--pfm-title-case); letter-spacing: var(--pfm-title-track); color: var(--pfm-band-ink); text-wrap: balance; }
.pfm-meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 0.86rem; color: var(--pfm-band-sub); }
.pfm-meta b { color: var(--pfm-band-text); font-weight: 600; }

/* ---------- Barra fissa ---------- */
.pfm-rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--pfm-material); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); }
.pfm-rail::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 14px; pointer-events: none; background: linear-gradient(var(--pfm-material), transparent); opacity: var(--pfm-edge, 0); transition: opacity 200ms; }
.pfm-rail-row { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.pfm-all { flex: none; height: 40px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px 0 12px; border-radius: 999px; background: var(--pfm-ink); color: var(--pfm-surface); font-size: 0.9rem; font-weight: 600; }
.pfm-all .pfm-i { width: 18px; height: 18px; }
.pfm-chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; padding: 0 20px 0 12px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 8px, #000 calc(100% - 22px), transparent); mask-image: linear-gradient(90deg, transparent, #000 8px, #000 calc(100% - 22px), transparent); }
.pfm-chips::-webkit-scrollbar { display: none; }
.pfm-chip { flex: none; height: 40px; padding: 0 15px; border-radius: 999px; font-size: 0.92rem; font-weight: 500; background: var(--pfm-chip); color: var(--pfm-ink-2); white-space: nowrap; }
.pfm-chip[aria-current="true"] { background: var(--pfm-accent); color: var(--pfm-on-accent); font-weight: 600; }
.pfm-ib { position: relative; flex: none; width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; background: var(--pfm-chip); color: var(--pfm-ink); }
.pfm-ib.pfm-on { background: var(--pfm-accent); color: var(--pfm-on-accent); }
.pfm-ib .pfm-i { width: 19px; height: 19px; }
.pfm-count { position: absolute; top: -3px; right: -3px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--pfm-band-ink); color: var(--pfm-band); font-size: 0.75rem; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px var(--pfm-ground); }
.pfm-search { flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 999px; background: var(--pfm-chip); }
.pfm-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 1rem; color: var(--pfm-ink); caret-color: var(--pfm-accent); }
.pfm-search input::placeholder { color: var(--pfm-ink-3); }
.pfm-search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.pfm-search .pfm-i { width: 17px; height: 17px; color: var(--pfm-ink-3); }
.pfm-fstrip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-bottom: 10px; font-size: 0.86rem; color: var(--pfm-ink-2); }
.pfm-fx { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px; border-radius: 999px; background: var(--pfm-surface); border: 1px solid var(--pfm-line); font-size: 0.84rem; font-weight: 500; color: var(--pfm-ink); }
.pfm-fx .pfm-i { width: 13px; height: 13px; }
.pfm-fx.pfm-reset { border-color: transparent; background: transparent; color: var(--pfm-accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- Menù ---------- */
.pfm-main > .pfm-wrap { padding-block: 0 28px; }
.pfm-status { margin: 18px 4px 0; font-size: 0.92rem; color: var(--pfm-ink-2); }
.pfm-sec { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--pfm-rail-h) + 8px); padding-top: 28px; }
.pfm-sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px; }
.pfm-sec h2 { font: var(--pfm-title-weight) 1.5rem/1.1 var(--pfm-title-font); text-transform: var(--pfm-title-case); letter-spacing: var(--pfm-title-track); text-wrap: balance; }
.pfm-sec-head span { font-size: 0.84rem; color: var(--pfm-ink-3); font-variant-numeric: tabular-nums; flex: none; }
.pfm-note { margin: 8px 4px 0; max-width: 36rem; color: var(--pfm-ink-2); font-size: 0.92rem; line-height: 1.55; white-space: pre-line; }
.pfm-note b { color: var(--pfm-ink); font-weight: 600; }
.pfm-note small { display: block; margin-top: 4px; font-size: 0.82rem; color: var(--pfm-ink-3); }
.pfm-list { margin-top: 12px; background: var(--pfm-surface); border-radius: 18px; overflow: hidden; }
.pfm-list li + li .pfm-item { border-top: 1px solid var(--pfm-line); }
.pfm-item { display: block; width: 100%; padding: 16px; transition: background 120ms; }
.pfm-item:active { background: var(--pfm-chip); transition-duration: 0ms; }
.pfm-item:focus-visible { outline-offset: -3px; border-radius: 18px; }
.pfm-item.pfm-has-ph { display: grid; grid-template-columns: minmax(0, 1fr) 88px; gap: 14px; align-items: start; }
.pfm-tx { display: block; min-width: 0; }
.pfm-r1 { display: flex; align-items: baseline; gap: 12px; }
.pfm-nm { flex: 1; min-width: 0; font-weight: 600; font-size: 1.04rem; line-height: 1.3; overflow-wrap: anywhere; }
.pfm-pr { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
.pfm .pfm-fz { display: inline-block; width: 15px; height: 15px; margin-left: 5px; vertical-align: -2px; color: var(--pfm-frost); }
.pfm-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.pfm-tg { display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.01em; background: var(--pfm-chip); color: var(--pfm-ink-2); }
.pfm-tg.pfm-spec { background: var(--pfm-soft); color: var(--pfm-soft-ink); }
.pfm-tg.pfm-new { background: var(--pfm-accent); color: var(--pfm-on-accent); }
.pfm-tg.pfm-hot { background: transparent; color: var(--pfm-hot); padding-left: 0; }
.pfm-tg .pfm-i { width: 13px; height: 13px; stroke-width: 2.2; }
.pfm-ds { max-width: 36rem; margin-top: 6px; color: var(--pfm-ink-2); font-size: 0.93rem; line-height: 1.5; white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pfm-al { display: block; margin-top: 8px; font-size: 0.82rem; color: var(--pfm-ink-3); }
.pfm-al b { font-weight: 600; color: var(--pfm-ink-2); margin-right: 5px; }
.pfm-al.pfm-unk { color: var(--pfm-warn); font-weight: 500; }
.pfm-th { width: 88px; height: 88px; border-radius: 14px; object-fit: cover; background: var(--pfm-chip); display: block; }
.pfm-empty { padding: 56px 12px; text-align: center; color: var(--pfm-ink-2); }
.pfm-empty button { margin-top: 14px; height: 44px; padding: 0 20px; border-radius: 999px; background: var(--pfm-accent); color: var(--pfm-on-accent); font-weight: 600; }

/* ---------- Piede ---------- */
.pfm-foot > .pfm-wrap { padding-block: 12px 40px; display: grid; gap: 8px; font-size: 0.86rem; color: var(--pfm-ink-3); }
.pfm-foot b { color: var(--pfm-ink-2); font-weight: 600; }
.pfm-legend { display: flex; align-items: center; gap: 6px; }
.pfm-legend .pfm-fz { margin: 0; }

/* ---------- Scheda (bottom sheet) ---------- */
.pfm-scrim { position: fixed; inset: 0; z-index: 40; background: var(--pfm-scrim); opacity: 0; pointer-events: none; }
.pfm-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: var(--pfm-max); margin: 0 auto; max-height: 90dvh; display: flex; flex-direction: column;
  background: var(--pfm-surface); color: var(--pfm-ink); border-radius: 22px 22px 0 0; box-shadow: var(--pfm-shadow); transform: translateY(110%); visibility: hidden; will-change: transform; overflow: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); }
.pfm-sheet::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 90px; background: var(--pfm-surface); }
.pfm-grab { position: relative; touch-action: none; cursor: grab; user-select: none; flex: none; }
.pfm-grab::before { content: ""; position: absolute; z-index: 2; top: 8px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--pfm-line); }
.pfm-grab.pfm-on-photo::before { background: rgba(255, 255, 255, 0.85); }
.pfm-hero { display: block; width: 100%; aspect-ratio: 4 / 3; max-height: 40dvh; object-fit: cover; background: var(--pfm-chip); }
.pfm-gh { display: flex; align-items: flex-start; gap: 12px; padding: 24px max(20px, env(safe-area-inset-right, 0px)) 4px max(20px, env(safe-area-inset-left, 0px)); }
.pfm-grab.pfm-on-photo .pfm-gh { padding-top: 16px; }
.pfm-gh h3 { flex: 1; min-width: 0; font-size: 1.45rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.pfm-x { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--pfm-chip); }
.pfm-x .pfm-i { width: 17px; height: 17px; }
.pfm-x.pfm-float { position: absolute; z-index: 3; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.45); color: #fff; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.pfm-sbody { overflow-y: auto; overscroll-behavior: contain; padding: 0 max(20px, env(safe-area-inset-right, 0px)) 28px max(20px, env(safe-area-inset-left, 0px)); }
.pfm-s-price { margin-top: 2px; font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.pfm-s-desc { margin-top: 14px; color: var(--pfm-ink-2); line-height: 1.6; white-space: pre-line; }
.pfm-opts { margin-top: 14px; border: 1px solid var(--pfm-line); border-radius: 14px; }
.pfm-opts li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; font-size: 0.94rem; }
.pfm-opts li + li { border-top: 1px solid var(--pfm-line); }
.pfm-opts span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
.pfm-s-blk { margin-top: 20px; }
.pfm-s-lbl { margin-bottom: 8px; font-size: 0.82rem; font-weight: 600; color: var(--pfm-ink-3); }
.pfm-a-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pfm-a-c { height: 34px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; background: var(--pfm-chip); font-size: 0.9rem; font-weight: 500; }
.pfm-a-none { color: var(--pfm-warn); font-weight: 500; }
.pfm-frozen { display: flex; gap: 10px; align-items: center; margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--pfm-frost) 10%, transparent); font-size: 0.92rem; }
.pfm-frozen .pfm-fz { margin: 0; width: 18px; height: 18px; }
.pfm-s-note { margin-top: 20px; font-size: 0.86rem; color: var(--pfm-ink-3); }
.pfm-ix-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pfm-ix { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; font-weight: 500; }
.pfm-ix span { font-size: 0.84rem; color: var(--pfm-ink-3); font-variant-numeric: tabular-nums; }
.pfm-ix[aria-current="true"] { background: var(--pfm-soft); color: var(--pfm-soft-ink); font-weight: 600; }
.pfm-ix[aria-current="true"] span { color: var(--pfm-soft-ink); }
.pfm-f-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.pfm-tog { height: 44px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--pfm-line); font-size: 0.92rem; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.pfm-tog[aria-pressed="true"] { background: var(--pfm-ink); color: var(--pfm-surface); border-color: var(--pfm-ink); }
.pfm-tog.pfm-ex[aria-pressed="true"] { background: var(--pfm-hot); border-color: var(--pfm-hot); color: #fff; text-decoration: line-through; }
.pfm-tog .pfm-i { width: 15px; height: 15px; }
.pfm-f-note { margin-top: 16px; font-size: 0.88rem; color: var(--pfm-ink-2); }
.pfm-f-act { display: flex; gap: 10px; margin-top: 20px; }
.pfm-f-act button { flex: 1; height: 52px; border-radius: 14px; font-weight: 600; text-align: center; }
.pfm-b-ghost { background: var(--pfm-chip); }
.pfm-b-main { background: var(--pfm-accent); color: var(--pfm-on-accent); }
.pfm-lang { display: grid; gap: 4px; }
.pfm-lang a, .pfm-lang div { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-radius: 14px; text-decoration: none; font-weight: 500; }
.pfm-lang [aria-current="true"] { background: var(--pfm-chip); font-weight: 600; }

/* ---------- Preferenze di sistema ---------- */
@media (prefers-reduced-motion: reduce) { .pfm *, .pfm *::before, .pfm *::after { transition-duration: 0ms !important; scroll-behavior: auto !important; } }
@media (prefers-reduced-transparency: reduce) { .pfm-rail { background: var(--pfm-ground); -webkit-backdrop-filter: none; backdrop-filter: none; } }
@media (prefers-contrast: more) { .pfm-chip, .pfm-ib, .pfm-search, .pfm-list { outline: 1px solid var(--pfm-ink-3); } }

/* ---------- Desktop (≥ 960px): indice laterale fisso, ricerca sempre aperta ---------- */
.pfm-side { display: none; }
@media (min-width: 960px) {
  .pfm { --pfm-max: 1080px; }

    const RM = matchMedia("(prefers-reduced-motion: reduce)"), DARKQ = matchMedia("(prefers-color-scheme: dark)");

    /* -- logo: ricolorato con l'accento (maschera) oppure originale -- */

    function applyColors() {

      root.classList.toggle("pfm-dark", dark);
      if (o.colors && o.colors.primary) {

    applyColors();

    const st = { q: "", ex: new Set(), only: new Set(), cur: null };
    try { const s = JSON.parse(sessionStorage.getItem(o.storageKey) || "{}"); (s.ex || []).forEach(x => ALL_A.includes(x) && st.ex.add(x)); (s.only || []).forEach(x => ALL_T.includes(x) && st.only.add(x)); } catch (e) {}
    const save = () => { try { sessionStorage.setItem(o.storageKey, JSON.stringify({ ex: [...st.ex], only: [...st.only] })); } catch (e) {} };
    const passFilters = it => !it.a.some(a => st.ex.has(a)) && [...st.only].every(t => it.t.includes(t));
    const passQuery = (it, c) => !st.q || norm([it.n, it.d, it.t.join(" "), c.name].join(" ")).includes(norm(st.q));
    const shown = c => c.items.filter(it => passFilters(it) && passQuery(it, c));

    /* -- render -- */
    function render() {
      let html = "", total = 0;
      for (const c of cats) {
        const items = shown(c); if (!items.length) continue; total += items.length;
        html += `<section class="pfm-sec" id="${c.id}" aria-labelledby="${c.id}-h"><div class="pfm-sec-head"><h2 id="${c.id}-h">${esc(c.name)}</h2><span>${items.length === c.items.length ? items.length : T.of(items.length, c.items.length)}</span></div>`;
        if (!st.q) html += c.notes.map(n => `<p class="pfm-note"><b>${esc(n.title)}</b>${n.text ? " " + esc(n.text) : ""}${(n.allergens || []).length ? `<small>${esc(T.allergensNote)}: ${esc(n.allergens.join(", "))}</small>` : ""}</p>`).join("");

          const al = it.a.length ? `<span class="pfm-al"><b>${esc(T.allergens)}</b>${esc(it.a.map(short).join(" · "))}</span>` : st.ex.size ? `<span class="pfm-al pfm-unk">${esc(T.allergensUnknown)}</span>` : "";
          return `<li><button class="pfm-item${it.ph ? " pfm-has-ph" : ""}" data-c="${c.id}" data-i="${i}" aria-haspopup="dialog"><span class="pfm-tx">
            <span class="pfm-r1"><span class="pfm-nm">${esc(it.n)}${fz(it)}</span><span class="pfm-pr">${eur(it.p)}</span></span>
            ${it.t.length ? `<span class="pfm-tags">${tags(it.t)}</span>` : ""}
            ${it.d ? `<span class="pfm-ds">${esc(it.d.replace(/\n\s*\n+/g, "\n"))}</span>` : ""}${al}</span>
            ${it.ph ? `<img class="pfm-th" src="${esc(it.ph.src)}" alt="" width="88" height="88" loading="lazy" decoding="async">` : ""}</button></li>`;
        }).join("") + `</ul></section>`;
      }
      if (!total) html = `<div class="pfm-empty"><p>${st.q ? esc(T.noResults(st.q)) : esc(T.noMatch)}</p><button class="pfm-tap" data-pfm="reset-all">${esc(T.showAll)}</button></div>`;
      menuEl.innerHTML = html;
      statusEl.hidden = !st.q || !total;
      statusEl.textContent = st.q ? T.results(total, st.q) : "";
      chipsEl.innerHTML = cats.filter(c => shown(c).length).map(c => `<button class="pfm-chip pfm-tap" data-go="${c.id}" aria-current="${st.cur === c.id}">${esc(c.name)}</button>`).join("");
      side.innerHTML = indexHtml();
      const n = st.ex.size + st.only.size;
      const hidden = cats.reduce((s, c) => s + c.items.length - c.items.filter(passFilters).length, 0);
      countEl.hidden = !n; countEl.textContent = n;

      fstrip.hidden = !n;

        [...st.ex].map(a => `<button class="pfm-fx pfm-tap" data-rx="${esc(a)}" aria-label="${esc(T.removeFilter(T.without(short(a))))}">${esc(T.without(short(a)))}${ico("x")}</button>`).join("") +
        [...st.only].map(t => `<button class="pfm-fx pfm-tap" data-ro="${esc(t)}" aria-label="${esc(T.removeFilter(t))}">${esc(t)}${ico("x")}</button>`).join("") +
        `<button class="pfm-fx pfm-reset pfm-tap" data-pfm="reset-filters">${esc(T.reset)}</button>` : "";
      measure(); spy();
    }
    const indexHtml = () => cats.map(c => { const k = shown(c).length; return k ? `<button class="pfm-ix pfm-tap" data-go="${c.id}" aria-current="${st.cur === c.id}">${esc(c.name)}<span>${k}</span></button>` : ""; }).join("");
    const measure = () => root.style.setProperty("--pfm-rail-h", rail.offsetHeight + "px");

    /* -- categoria corrente (scroll-spy) -- */
    let io, navLock = false, lockTimer = 0;
    function spy() {

        if (top && !navLock) setCur(top[0]);

      root.querySelectorAll(".pfm-sec").forEach(s => io.observe(s));
      if (!st.cur) { const f = root.querySelector(".pfm-sec"); if (f) setCur(f.id); }
    }
    function setCur(id) {
      if (st.cur === id) return; st.cur = id;
      root.querySelectorAll("[data-go]").forEach(b => b.setAttribute("aria-current", b.dataset.go === id));
      const ch = chipsEl.querySelector(`[data-go="${id}"]`);
      if (ch && chipsEl.offsetParent) chipsEl.scrollTo({ left: Math.max(0, ch.getBoundingClientRect().left - chipsEl.getBoundingClientRect().left + chipsEl.scrollLeft - Math.max(12, (chipsEl.clientWidth - ch.offsetWidth) / 2)), behavior: RM.matches ? "auto" : "smooth" });
    }
    // Durante lo scorrimento avviato da un tocco la barra resta sulla categoria scelta
    function lockNav() {

      const release = () => { navLock = false; removeEventListener("scroll", onScroll); };
      const onScroll = () => { clearTimeout(lockTimer); lockTimer = setTimeout(release, 140); };
      addEventListener("scroll", onScroll, { passive: true });
      lockTimer = setTimeout(release, 900);
    }
    function goTo(id) {
      const s = root.querySelector("#" + id); if (!s) return;
      setCur(id); lockNav();
      s.scrollIntoView({ behavior: RM.matches ? "auto" : "smooth" });
      try { history.replaceState(history.state, "", "#" + id); } catch (e) {}
    }
    addEventListener("scroll", () => rail.style.setProperty("--pfm-edge", rail.getBoundingClientRect().top <= 1 ? 1 : 0), { passive: true });
    addEventListener("resize", () => { measure(); spy(); });

    /* -- scheda: molla (smorzamento + risposta), trascinamento, slancio, tasto indietro -- */
    let y = 0, v = 0, H = 1, raf = 0, open = false, back = null, mode = "", pushed = false, dr = null;
    const rubber = (x, d, c = 0.55) => (x * d * c) / (d + c * Math.abs(x));
    const paint = () => { sheet.style.transform = `translateY(${y < 0 ? -rubber(-y, H) : y}px)`; scrim.style.opacity = Math.max(0, Math.min(1, 1 - y / H)); };
    function springTo(t, damping, response, done) {
      cancelAnimationFrame(raf);
      if (RM.matches) { y = t; v = 0; paint(); done && done(); return; }
      const k = (2 * Math.PI / response) ** 2, c = 4 * Math.PI * damping / response; let last = performance.now();

      };

    }
    const setInert = on => root.querySelectorAll(".pfm-band, .pfm-rail, .pfm-shell, .pfm-foot").forEach(el => { el.inert = on; });
    function openSheet({ title, html, photo, from, m }) {
      mode = m; q("#pfm-s-title").textContent = title; sbody.innerHTML = html; sbody.scrollTop = 0;
      if (photo) { hero.src = photo.src; hero.alt = photo.alt || title; hero.hidden = false; } else { hero.hidden = true; hero.removeAttribute("src"); }
      grab.classList.toggle("pfm-on-photo", !!photo); xBtn.classList.toggle("pfm-float", !!photo);
      if (photo) grab.prepend(xBtn); else gh.append(xBtn);
      back = from || document.activeElement;

      open = true; document.documentElement.style.overflow = "hidden";
      springTo(0, 1, 0.38);
      sheet.tabIndex = -1; sheet.focus({ preventScroll: true });
    }
    function closeSheet(vel = 0, then, fromHistory) {
      if (!open) return;
      open = false; v = vel; setInert(false);
      if (pushed && !fromHistory) { pushed = false; try { history.back(); } catch (e) {} } else pushed = false;
      springTo(H, 1, 0.3, () => { sheet.style.visibility = "hidden"; scrim.style.pointerEvents = "none"; document.documentElement.style.overflow = ""; mode = ""; if (!then && back && back.focus) back.focus({ preventScroll: true }); then && then(); });
    }
    addEventListener("popstate", () => { if (open) closeSheet(0, null, true); else pushed = false; });
    scrim.addEventListener("click", () => closeSheet());
    addEventListener("keydown", e => { if (e.key === "Escape" && open) closeSheet(); });
    grab.addEventListener("pointerdown", e => { if (e.target.closest(".pfm-x")) return; cancelAnimationFrame(raf); grab.setPointerCapture(e.pointerId); dr = { y0: e.clientY, p0: y, hist: [[e.timeStamp, e.clientY]] }; });
    grab.addEventListener("pointermove", e => { if (!dr) return; y = dr.p0 + e.clientY - dr.y0; dr.hist.push([e.timeStamp, e.clientY]); if (dr.hist.length > 6) dr.hist.shift(); paint(); });
    const release = e => {
      if (!dr) return; const h = dr.hist, a = h[0], b = h[h.length - 1];
      const vel = b[0] > a[0] ? (b[1] - a[1]) / ((b[0] - a[0]) / 1000) : 0, moved = Math.abs(e.clientY - dr.y0); dr = null;

      if (end > H * 0.45 && vel > -50) closeSheet(vel); else { v = vel; springTo(0, 0.8, 0.3); }
    };
    grab.addEventListener("pointerup", release); grab.addEventListener("pointercancel", release);

    function dishSheet(it, from) {
      const { text, opts } = splitOptions(it.d);

      if (it.t.length) h += `<div class="pfm-tags" style="margin-top:10px">${tags(it.t)}</div>`;

      h += `<div class="pfm-s-blk"><p class="pfm-s-lbl">${esc(T.allergens)}</p>${it.a.length ? `<div class="pfm-a-row">${it.a.map(a => `<span class="pfm-a-c">${esc(a)}</span>`).join("")}</div>` : `<p class="pfm-a-none">${esc(T.allergensNoneDeclared)}</p>`}</div>`;
      h += `<p class="pfm-s-note">${esc(T.staffNote)}</p>`;
      openSheet({ title: it.n, html: h, photo: it.ph, from, m: "dish" });

    function drawFilters() {

      if (act === "close") return closeSheet();

      if (act === "filters") { openSheet({ title: T.filters, html: "", from: filterBtn, m: "filters" }); drawFilters(); H = sheet.getBoundingClientRect().height + 40; return; }
      if (act === "lang") return langSheet(t.closest("[data-pfm]"));
      if (act === "search") return setSearch(searchBox.hidden);
      const rx = t.closest("[data-rx]"); if (rx) { st.ex.delete(rx.dataset.rx); save(); return render(); }
      const ro = t.closest("[data-ro]"); if (ro) { st.only.delete(ro.dataset.ro); save(); return render(); }
      if (act === "reset-filters") { st.ex.clear(); st.only.clear(); save(); return render(); }
      if (act === "reset-all") { st.ex.clear(); st.only.clear(); save(); setSearch(false); return render(); }
      if (mode === "filters" && sbody.contains(t)) {
        const x = t.closest("[data-ex]"), on = t.closest("[data-only]");
        if (x) st.ex.has(x.dataset.ex) ? st.ex.delete(x.dataset.ex) : st.ex.add(x.dataset.ex);
        else if (on) st.only.has(on.dataset.only) ? st.only.delete(on.dataset.only) : st.only.add(on.dataset.only);
        else if (t.closest("[data-clear]")) { st.ex.clear(); st.only.clear(); }
        else if (t.closest("[data-done]")) return closeSheet();
        else return;
        save(); render(); drawFilters();
      }
    });
    input.addEventListener("input", () => {
      st.q = input.value.trim(); render();
      const top = q(".pfm-shell").getBoundingClientRect().top + scrollY - rail.offsetHeight;
      if (scrollY > top) scrollTo({ top });
    });
    input.addEventListener("keydown", e => { if (e.key === "Escape") setSearch(false); });

    render();
    const h0 = location.hash.slice(1); if (h0 && root.querySelector("#" + CSS.escape(h0))) setTimeout(() => goTo(h0), 50);

    return { render, setTitleStyle, setTheme(t) { o.theme = t; applyColors(); }, setColors(c) { o.colors = c; applyColors(); } };
  }

  global.PlateformMenuSkin = { mount, computeTokens, STRINGS };

gu vi", "price": 13.5, "tags": [], "description": "Ciotola di riso bianco accompagnato da fettine di manzo con mix di spezie alla vietnamita, verdure e fiocchi di cipolla fritta", "allergens": ["Glutine", "Pesce", "Soia", "Sedano", "Sesamo"], "frozen": true, "photo": null}, {"name": "Com ga cari", "price": 13.0, "tags": [], "description": "Ciotola di riso bianco accompagnato da straccetti di coscia di pollo stufato, curry, latte di cocco, verdure e fiocchi di cipolla fritta", "allergens": ["Glutine", "Pesce", "Soia", "Sedano"], "frozen": true, "photo": null}, {"name": "Com ga sate", "price": 13.0, "tags": ["Specialità", "Piccante"], "description": "Ciotola di riso bianco accompagnato da straccetti di coscia di pollo stufato in salsa satè (aglio, scalogno, peperoncino, lemon grass, zenzero), verdure e fiocchi di cipolla fritta", "allergens": ["Glutine", "Pesce", "Soia"], "frozen": true, "photo": null}, {"name": "Com suon xa xiu", "price": 15.0, "tags": ["Novità", "Specialità"], "description": "Ciotola di riso bianco accompagnato da costine di maiale al forno marinate in salsa \"xa xiu\", con verdure fresche e fiocchi di cipolla fritta", "allergens": ["Glutine", "Soia", "Sesamo"], "frozen": true, "photo": null}, {"name": "Com rau cari", "price": 12.5, "tags": [], "description": "Ciotola di riso bianco accompagnato da verdure saltate al wok al curry, tofu fritto, latte di cocco e fiocchi di cipolla fritta", "allergens": ["Glutine", "Pesce", "Soia", "Sedano"], "frozen": false, "photo": null}, {"name": "Com thit rang", "price": 13.5, "tags": ["Specialità"], "description": "Ciotola di riso bianco accompagnato da coppa di suino marinata al lemon grass, sesamo, erbe aromatiche e verdure fresche. Servita con salsa di pesce \"nuoc mam\"", "allergens": ["Glutine", "Pesce", "Soia", "Sesamo"], "frozen": true, "photo": null}, {"name": "Com rau sate", "price": 12.5, "tags": ["Piccante", "Specialità"], "description": "Ciotola di riso bianco accompagnato da tofu fritto in salsa sate (aglio, scalogno, peperoncino, lemon grass, zenzero), verdure e fiocchi di cipolla fritta", "allergens": ["Glutine", "Pesce", "Soia"], "frozen": false, "photo": null}, {"name": "Com thit heo xao sate", "price": 13.0, "tags": ["Piccante", "Specialità"], "description": "Ciotola di riso bianco accompagnato da fettine di coppa di suino marinate al lemon grass in salsa sate (aglio, scalogno, peperoncino, lemon grass, zenzero), verdure e fiocchi di cipolla fritta", "allergens": ["Glutine", "Soia"], "frozen": true, "photo": null}, {"name": "Com trang", "price": 3.0, "tags": [], "description": "Ciotola di riso bianco", "allergens": [], "frozen": false, "photo": null}]}, {"name": "Noodles di riso", "notes": [{"title": "Bun xao:", "text": "I Bun, a differenza delle tagliatelle, sono lunghi e sottili, vengono saltati al wok con verdure croccanti, erbe aromatiche e salsa di pesce \"nuoc mam\". Piatto tipico e rinfrescante della cucina del Sud del Vietnam, leggero e profumato, perfetto in ogni stagione.", "allergens": []}], "items": [{"name": "Bun xao bo", "price": 13.5, "tags": [], "description": "Vermicelli di riso saltati al wok con straccetti di manzo, verdure fresche, arachidi, fiocchi di cipolla fritta. Serviti con salsa di pesce \"nuoc mam\"", "allergens": ["Glutine", "Pesce", "Arachidi", "Soia", "Sedano", "Sesamo"], "frozen": true, "photo": null}, {"name": "Bun xao rau", "price": 12.5, "tags": [], "description": "Vermicelli di riso saltati al wok con tofu fritto, verdure, arachidi e fiocchi di cipolla fritta", "allergens": ["Glutine", "Pesce", "Arachidi", "Soia", "Sedano", "Sesamo"], "frozen": false, "photo": null}, {"name": "Bun thit nuong, cha gio", "price": 15.0, "tags": ["Specialità"], "description": "Vermicelli di riso tiepidi, pancetta di maiale marinata, verdure fresche, arachidi ed involtino cha gio thit. Serviti con salsa di pesce \"nuoc mam\" e cipollotti", "allergens": ["Glutine", "Pesce", "Arachidi", "Soia", "Sesamo"], "frozen": true, "photo": null}, {"name": "Bun bo xao cari", "price": 13.5, "tags": ["Specialità", "Novità", "Di stagione"], "description": "Vermicelli di riso tiepidi, verdure fresche, straccetti di manzo saltato al curry, salsa di pesce, arachidi e fiocchi di cipolla fritta.", "allergens": ["Glutine", "Pesce", "Arachidi", "Soia"], "frozen": true, "photo": null}, {"name": "Bun ga xao cari", "price": 13.0, "tags": ["Specialità", "Novità", "Di stagione"], "description": "Vermicelli di riso tiepidi, verdure fresche, straccetti di pollo saltato al curry, salsa di pesce, arachidi e fiocchi di cipolla fritta.", "allergens": ["Glutine", "Pesce", "Arachidi", "Soia"], "frozen": true, "photo": null}]}, {"name": "Dolci 🧉🍧", "notes": [], "items": [{"name": "Che dau trang", "price": 5.0, "tags": ["Specialità", "Per due persone", "Senza lattosio", "Senza glutine"], "description": "Riso glutinoso servito con crema al cocco e fagioli dall'occhiello nero", "allergens": [], "frozen": false, "photo": null}, {"name": "Torta di riso glutinoso con ripieno di fagioli mungo e pandano", "price": 3.0, "tags": ["Senza lattosio", "Senza glutine"], "description": "La torta di riso glutinoso ripiena di crema di fagioli mungo è una specialità tradizionale particolarmente apprezzata nelle province centrali e sud-occidentali del Vietnam. La parte esterna è soffice e liscia grazie all'impasto morbido in cui amido (di solito di tapioca) e margarina sono uniti alla farina di riso glutinoso. L'interno cremoso è una pasta di legumi che viene aromatizzata in vari modi, per esempio con scaglie di cocco grattugiato o con l'estratto di foglie di Pandano, pianta tropicale che dona una delicata dolcezza.", "allergens": [], "frozen": false, "photo": null}]}, {"name": "Acqua 💧", "notes": [], "items": [{"name": "Acqua naturale/frizzante Pejo in vetro 0,75cl", "price": 2.5, "tags": [], "description": "", "allergens": [], "frozen": false, "photo": null}, {"name": "Acqua mezzo litro nat/gas plastica", "price": 1.5, "tags": [], "description": "", "allergens": [], "frozen": false, "photo": null}, {"name": "Caffè Poli", "price": 2.0, "tags": [], "description": "100% arabica", "allergens": [], "frozen": false, "photo": null}]}, {"name": "Cold Brew - caffè freddo", "notes": [], "items": [{"name": "Pure Cold Brew Shot", "price": 3.0, "tags": ["Di stagione"], "description": "Caffè Specialty (monorigine Congo Shasha) a estrazione fredda (8 ore), servito in purezza su cubetti di ghiaccio. Naturalmente dolce, fruttato e dissetante, senza zuccheri aggiunti.", "allergens": [], "frozen": false, "photo": null}, {"name": "Spicy Coffee Mule", "price": 5.5, "tags": [], "description": "L'incontro audace tra il nostro caffè Specialty e la nota piccante e frizzante del ginger beer. Servito con ghiaccio e una spruzzata di lime fresco. Un fine pasto (o break) sorprendentemente energizzante e dissetante.\n(100% Vegetale - Senza Glutine)", "allergens": [], "frozen": false, "photo": null}, {"name": "Earl Grey Coffee (corretto con liquore)", "price": 6.0, "tags": [], "description": "Un incontro inaspettato tra Oriente e Occidente: Caffè Specialty freddo ed eccezionale liquore artigianale all'Earl Grey. Una sinfonia estiva di note tostate e profumi di bergamotto, servita su ghiaccio.", "allergens": [], "frozen": false, "photo": null}, {"name": "Lapsang Smoke Coffee (corretto con liquore)", "price": 6.0, "tags": [], "description": "Il nostro Caffè Specialty freddo incontra le note profondamente affumicate e legnose del pluripremiato liquore al tè Lapsang Souchong (Whistler's Storm). Un fine pasto sorprendente ed elegante per gli amanti dei sentori torbati. Servito con ghiaccio", "allergens": [], "frozen": false, "photo": null}]}, {"name": "Esperienze analcoliche", "notes": [], "items": [{"name": "Best mango - 25cl", "price": 3.0, "tags": [], "description": "Nettare di mango", "allergens": [], "frozen": false, "photo": null}, {"name": "Gemellii - Ginger beer", "price": 4.0, "tags": [], "description": "Un mix vibrante di zenzero piccante e della delicata dolcezza dell'agave - 200ml", "allergens": [], "frozen": false, "photo": null}, {"name": "Bibo Runge - Riesling Zero Alcool", "price": 6.0, "tags": [], "description": "Un Riesling senza alcol che mantiene l'eleganza e la freschezza del vitigno, grazie a un'attenta tecnica di produzione. L'alcol è stato estratto a bassa pressione (sottovuoto) e successivamente è stato aggiunto un tocco di Riesling intenso. Al naso note di scorze di limone, accompagnate da aromi fruttati che ricordano la vivacità del Riesling. Colore oro tenue con riflessi verdognoli. Al palato il vino è elegante, con una piacevole persistenza che invita a un altro sorso.\nResiduo zuccherino 2,5 g", "allergens": ["Anidride solforosa e solfiti"], "frozen": false, "photo": null}, {"name": "Gemellii - Mojito analcolico servito con ghiaccio, lime e foglia di menta", "price": 7.0, "tags": [], "description": "Ispirato al Brasile, questo Mojito Mocktail è una miscela leggera e rinvigorente di menta fresca, lime saporito e zucchero di canna, che offre un gusto frizzante, vibrante e rinfrescante dello spirito tropicale di Rio. Una celebrazione frizzante del ritmo e del sole in ogni sorso.", "allergens": [], "frozen": false, "photo": null}]}, {"name": "Birra 🍻", "notes": [], "items": [{"name": "Birra Saigon - 33cl", "price": 6.5, "tags": [], "description": "Lager Premium a bassa fermentazione ottenuta da malto d'orzo, luppolo e riso.", "allergens": ["Glutine"], "frozen": false, "photo": null}]}, {"name": "Vini al calice 🥂", "notes": [], "items": [{"name": "Weingut Max Ferd. Richter - Riesling Trocken '25", "price": 6.0, "tags": [], "description": "Germania Mosella - residuo zuccherino 6-8 g/l", "allergens": ["Anidride solforosa e solfiti"], "frozen": false, "photo": null}, {"name": "Weingut Max Ferd. Richter - Riesling “Zeppelin” '25", "price": 6.0, "tags": [], "description": "Germania Mosella - Residuo zuccherino 30g/l", "allergens": ["Anidride solforosa e solfiti"], "frozen": false, "photo": null} e l'eleganza e la freschezza del vitigno, grazie a un'attenta tecnica di produzione. L'alcol è stato estratto a bassa pressione (sottovuoto) e successivamente è stato aggiunto un tocco di Riesling intenso. Al naso note di scorze di limone, accompagnate da aromi fruttati che ricordano la vivacità del Riesling. Colore oro tenue con riflessi verdognoli. Al palato il vino è elegante, con una piacevole persistenza che invita a un altro sorso.\nResiduo zuccherino 2,5 g", "allergens": ["Anidride solforosa e solfiti"], "frozen": false, "photo": null}]}, {"name": "Vini invecchiati 👵", "notes": [], "items": [{"name": "Schloss Lieser - W. Sonnnenuhr Spatlese '18", "price": 50.0, "tags": [], "description": "Agricoltura sostenibile - Germania Mosella - Residuo zuccherino 85 g/l", "allergens": ["Anidride solforosa e solfiti"], "frozen": false, "photo": null}, {"name": "Zilliken - Rausch Spatlese '11", "price": 115.0, "tags": [], "description": "Agricoltura sostenibile - Germania Mosella - residuo zuccherino 70 g/l", "allergens": ["Anidride solforosa e solfiti"], "frozen": false, "photo": null}]}, {"name": "Amari, liquori, distillati 🥃", "notes": [], "items": [{"name": "Vodka Vietnamita - Nep Moi", "price": 5.0, "tags": ["Specialità"], "description": "Vodka di riso, distillata da riso glutinoso appena raccolto, miscelata con vodka di grano per ottenere una gradazione alcolica al 39.5% Vol. Molto apprezzata dai consumatori locali, ma anche da giapponesi, coreani, e turisti provenienti da tutto il mondo, è diventata presto un simbolo della cultura vietnamita", "allergens": [], "frozen": false, "photo": null}, {"name": "Bud Spencer \"The Legend\"", "price": 5.0, "tags": [], "description": "Liquore alla cannella ed al peperoncino", "allergens": [], "frozen": false, "photo": null}, {"name": "Nizurin", "price": 5.0, "tags": [], "description": "Liquore alla nocciola piemontese (2100 bottiglie prodotte)", "allergens": [], "frozen": false, "photo": null}, {"name": "Grappa \"La cristallina\
