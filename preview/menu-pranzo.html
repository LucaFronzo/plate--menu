<style>
/* Layout: one continuous menu column (max 600px). Lacquer-red header, a frosted sticky category rail,
   dish rows on a quiet paper ground; details open in a draggable bottom sheet. */
:root {
  --lacquer: #6E1410;        /* brand oxblood, from the logo */
  --saffron: #F2A81D;        /* brand yellow */
  --ground: #F7F5F1;
  --surface: #FFFFFF;
  --ink: #1D1513;
  --ink-2: #5E5350;
  --ink-3: #8C817D;
  --line: #E7E2DC;
  --chip: #EFEBE6;
  --accent: #8A1C15;
  --accent-ink: #FFFFFF;
  --tag-bg: #FBEFD6;
  --tag-ink: #7A4A00;
  --hot: #B3261E;
  --material: rgba(247, 245, 241, 0.72);
  --scrim: rgba(20, 10, 8, 0.42);
  --shadow: 0 -8px 40px rgba(40, 15, 10, 0.18);
  --f-display: "Oswald", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141010; --surface: #1D1817; --ink: #F3ECE8; --ink-2: #BDB1AC; --ink-3: #8A7F7B;
    --line: #2E2725; --chip: #2A2321; --accent: #F2A81D; --accent-ink: #1D1513;
    --tag-bg: #3A2A12; --tag-ink: #F5C46A; --hot: #FF8A80;
    --material: rgba(20, 16, 16, 0.7); --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 -8px 40px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #141010; --surface: #1D1817; --ink: #F3ECE8; --ink-2: #BDB1AC; --ink-3: #8A7F7B;
  --line: #2E2725; --chip: #2A2321; --accent: #F2A81D; --accent-ink: #1D1513;
  --tag-bg: #3A2A12; --tag-ink: #F5C46A; --hot: #FF8A80;
  --material: rgba(20, 16, 16, 0.7); --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 -8px 40px rgba(0,0,0,0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--ground); color: var(--ink);
  font: 400 1rem/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 600px; margin: 0 auto; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.hero { background: var(--lacquer); color: #FBE9C8; }
.hero .wrap { padding-block: 28px 24px; display: flex; gap: 16px; align-items: center; }
.hero svg { flex: none; width: 64px; height: 64px; }
.wordmark { font: 600 1.9rem/0.95 var(--f-display); letter-spacing: 0.01em; text-transform: uppercase; color: var(--saffron); margin: 0; text-wrap: balance; }
.hero-meta { margin: 8px 0 0; font-size: 0.82rem; color: #E9C9A8; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.hero-meta b { color: #FFF3DC; font-weight: 600; }

/* Sticky rail: translucent material, content scrolls beneath */
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--material);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
}
.rail::after { /* scroll-edge effect instead of a hard divider */
  content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 14px; pointer-events: none;
  background: linear-gradient(var(--material), transparent); opacity: var(--edge, 0); transition: opacity 200ms;
}
.rail .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.chips { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; mask-image: linear-gradient(90deg, #000 88%, transparent); }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 8px 14px; border-radius: 999px; font-size: 0.88rem; font-weight: 500;
  background: var(--chip); color: var(--ink-2); white-space: nowrap;
  transition: background 160ms, color 160ms, transform 100ms ease-out;
}
.chip[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.chip:active, .icon-btn:active { transform: scale(0.95); transition-duration: 60ms; }
.icon-btn {
  position: relative; flex: none; width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center;
  background: var(--chip); color: var(--ink); transition: transform 100ms ease-out;
}
.icon-btn svg { width: 19px; height: 19px; }
.badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--saffron); color: #1D1513; font-size: 0.68rem; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--chip); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 0.95rem; color: var(--ink); outline: none; }
.search input::placeholder { color: var(--ink-3); }
.search svg { width: 17px; height: 17px; color: var(--ink-3); flex: none; }

/* Active filters summary */
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-block: 12px 0; font-size: 0.82rem; color: var(--ink-2); }
.pill-x { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.8rem; }

/* Sections */
main .wrap { padding-block: 8px 24px; }
section { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); padding-top: 28px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h2 { font: 600 1.45rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.sec-head span { font-size: 0.78rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.intro { margin: 8px 0 4px; color: var(--ink-2); font-size: 0.9rem; line-height: 1.55; max-width: 62ch; }
.intro b { color: var(--ink); font-weight: 600; }

.list { list-style: none; margin: 12px 0 0; padding: 0; background: var(--surface); border-radius: 18px; overflow: hidden; }
.dish { display: block; width: 100%; text-align: left; padding: 16px 16px 15px; transition: background 120ms, transform 100ms ease-out; }
.list li + li .dish { border-top: 1px solid var(--line); }
.dish:active { background: var(--chip); transition-duration: 0ms; }
.row1 { display: flex; align-items: baseline; gap: 12px; }
.name { flex: 1; min-width: 0; font-weight: 600; font-size: 1.02rem; line-height: 1.3; letter-spacing: -0.005em; }
.price { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.98rem; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.02em; padding: 2px 8px; border-radius: 6px; background: var(--tag-bg); color: var(--tag-ink); }
.tag.hot { background: transparent; color: var(--hot); padding-left: 0; }
.tag.new { background: var(--accent); color: var(--accent-ink); }
.desc { margin: 6px 0 0; color: var(--ink-2); font-size: 0.88rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.allerg { margin: 8px 0 0; font-size: 0.76rem; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 2px 6px; }
.allerg b { font-weight: 600; color: var(--ink-2); }
.empty { padding: 48px 8px; text-align: center; color: var(--ink-2); }
.empty button { margin-top: 12px; padding: 10px 18px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }

footer .wrap { padding-block: 24px 48px; color: var(--ink-3); font-size: 0.8rem; display: grid; gap: 6px; }
footer b { color: var(--ink-2); font-weight: 600; }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; z-index: 40; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; margin: 0 auto; max-width: 600px;
  max-height: 88dvh; display: flex; flex-direction: column;
  background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  transform: translateY(110%); visibility: hidden; will-change: transform;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 80px; background: var(--surface); } /* covers overshoot */
.grab { touch-action: none; cursor: grab; padding: 10px max(20px, env(safe-area-inset-right, 0px)) 4px max(20px, env(safe-area-inset-left, 0px)); user-select: none; }
.grab::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 max(20px, env(safe-area-inset-right, 0px)) 28px max(20px, env(safe-area-inset-left, 0px)); }
.sh-title { display: flex; align-items: baseline; gap: 12px; }
.sh-title h3 { flex: 1; margin: 0; font-size: 1.5rem; line-height: 1.15; letter-spacing: -0.015em; font-weight: 700; text-wrap: balance; }
.sh-title .price { font-size: 1.15rem; }
.sh-sub { margin: 4px 0 0; font-size: 0.82rem; color: var(--ink-3); }
.sh-desc { margin: 14px 0 0; color: var(--ink-2); line-height: 1.6; font-size: 0.95rem; }
.sh-block { margin-top: 20px; }
.sh-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
.a-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.a-chip { padding: 6px 12px; border-radius: 999px; background: var(--chip); font-size: 0.85rem; font-weight: 500; }
.a-none { font-size: 0.9rem; color: var(--ink-2); }
.opts { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 14px; }
.opts li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; font-size: 0.92rem; }
.opts li + li { border-top: 1px solid var(--line); }
.opts span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
.pair { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; background: var(--tag-bg); color: var(--tag-ink); font-size: 0.9rem; width: 100%; text-align: left; }
.pair b { display: block; color: var(--ink); font-weight: 600; }
.note { margin-top: 20px; font-size: 0.8rem; color: var(--ink-3); line-height: 1.5; }

/* Filter sheet */
.f-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle { padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.9rem; font-weight: 500; transition: background 140ms, color 140ms, border-color 140ms, transform 100ms ease-out; }
.toggle:active { transform: scale(0.96); }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.toggle.ex[aria-pressed="true"] { background: var(--hot); border-color: var(--hot); color: #fff; text-decoration: line-through; }
.f-actions { display: flex; gap: 10px; margin-top: 24px; }
.f-actions button { flex: 1; height: 50px; border-radius: 14px; font-weight: 600; }
.btn-ghost { background: var(--chip); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }

@media (prefers-reduced-motion: reduce) {
  .chips { scroll-behavior: auto; }
  * { transition-duration: 0ms !important; }
}
@media (prefers-reduced-transparency: reduce) {
  .rail { background: var(--ground); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (min-width: 640px) {
  .wordmark { font-size: 2.3rem; }
}
</style>

const PREFS = ["Senza glutine", "Senza lattosio", "Vegetariano", "Piccante", "Specialità", "Novità"];
const state = { q: "", ex: new Set(), pref: new Set() };
try { const s = JSON.parse(localStorage.getItem("gmv-filters") || "{}"); (s.ex || []).forEach(x => state.ex.add(x)); (s.pref || []).forEach(x => state.pref.add(x)); } catch (e) {}
const save = () => { try { localStorage.setItem("gmv-filters", JSON.stringify({ ex: [...state.ex], pref: [...state.pref] })); } catch (e) {} };

const $ = s => document.querySelector(s);
const eur = v => v.toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase();
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tagHtml = t => t.map(x => `<span class="tag${x === "Piccante" ? " hot" : x === "Novità" ? " new" : ""}">${x === "Piccante" ? "🌶 " : ""}${x}</span>`).join("");

function match(it) {
  if (it.a.some(x => state.ex.has(x))) return false;
  for (const p of state.pref) if (!it.t.includes(p)) return false;
  if (state.q) { const q = norm(state.q); if (!norm(it.n + " " + it.o + " " + it.d).includes(q)) return false; }
  return true;
}

function render() {
  let html = "", total = 0;
  C.forEach((c, ci) => {
    const items = c.items.map((it, ii) => ({ it, ii })).filter(x => match(x.it));
    if (!items.length) return;
    total += items.length;
    html += `<section id="${c.id}" data-cat="${c.id}"><div class="sec-head"><h2>${c.name}</h2><span>${items.length}</span></div>`;
    if (c.note && !state.q) html += `<p class="intro">${c.note}</p>`;
    html += `<ul class="list">` + items.map(({ it, ii }) => `<li><button class="dish" data-c="${ci}" data-i="${ii}">
      <div class="row1"><span class="name">${it.n}</span><span class="price">${it.from ? "" : ""}${eur(it.p)}</span></div>
      ${it.t.length ? `<div class="tags">${tagHtml(it.t)}</div>` : ""}
      ${it.d ? `<p class="desc">${it.d}</p>` : it.o ? `<p class="desc">${it.o}</p>` : ""}
      ${it.a.length ? `<p class="allerg"><b>Allergeni</b>${it.a.map(x => A[x]).join(" · ")}</p>` : ""}
    </button></li>`).join("") + `</ul></section>`;
  });
  if (!total) html = `<div class="empty"><p>Nessun piatto corrisponde ${state.q ? `a “${esc(state.q)}”` : "ai filtri scelti"}.</p><button id="reset">Mostra tutto il menù</button></div>`;
  $("#menu").innerHTML = html;
  const r = $("#reset"); if (r) r.onclick = clearAll;
  // chips mirror visible sections
  $("#chips").innerHTML = C.filter(c => document.getElementById(c.id)).map(c => `<button class="chip" data-go="${c.id}">${c.name}</button>`).join("");
  // active filter summary
  const n = state.ex.size + state.pref.size;
  $("#fCount").hidden = !n; $("#fCount").textContent = n;
  const af = $("#activeFilters"); af.hidden = !n;
  af.innerHTML = n ? `<span>${total} piatti ·</span>` + [...state.ex].map(x => `<button class="pill-x" data-rx="${x}">Senza ${A[x].toLowerCase()} ✕</button>`).join("") + [...state.pref].map(x => `<button class="pill-x" data-rp="${x}">${x} ✕</button>`).join("") : "";
  observe();
}
function clearAll() { state.q = ""; $("#q").value = ""; state.ex.clear(); state.pref.clear(); save(); render(); }

/* Scrollspy + scroll-edge effect */
let io;
function observe() {
  io && io.disconnect();
  const vis = new Map();
  io = new IntersectionObserver(es => {
    es.forEach(e => vis.set(e.target.id, e.isIntersecting ? e.boundingClientRect.top : null));
    const cur = [...vis].filter(([, v]) => v !== null).sort((a, b) => a[1] - b[1])[0];
    if (cur) setActive(cur[0]);
  }, { rootMargin: "-70px 0px -55% 0px" });
  document.querySelectorAll("section").forEach(s => io.observe(s));
  const first = document.querySelector("section"); if (first) setActive(first.id);
}
function setActive(id) {
  document.querySelectorAll(".chip").forEach(ch => {
    const on = ch.dataset.go === id;
    ch.setAttribute("aria-current", on);
    if (on) { const box = $("#chips"); box.scrollTo({ left: ch.offsetLeft - box.clientWidth / 2 + ch.clientWidth / 2 }); }
  });
}
addEventListener("scroll", () => { $("#rail").style.setProperty("--edge", $("#rail").getBoundingClientRect().top <= 1 ? 1 : 0); }, { passive: true });

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { const s = document.getElementById(go.dataset.go); s.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); setActive(go.dataset.go); return; }
  const d = e.target.closest(".dish"); if (d) return openDish(C[d.dataset.c].items[d.dataset.i], d);
  const rx = e.target.closest("[data-rx]"); if (rx) { state.ex.delete(rx.dataset.rx); save(); return render(); }
  const rp = e.target.closest("[data-rp]"); if (rp) { state.pref.delete(rp.dataset.rp); save(); return render(); }
});

/* Search */
$("#searchBtn").onclick = () => {
  const open = $("#searchBox").hidden;
  $("#searchBox").hidden = !open; $("#chips").hidden = open;
  $("#searchBtn").setAttribute("aria-label", open ? "Chiudi ricerca" : "Cerca");
  $("#searchBtn").innerHTML = open ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  if (open) $("#q").focus(); else if (state.q) { state.q = ""; $("#q").value = ""; render(); }
};
$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); scrollTo({ top: $("#rail").offsetTop }); });

/* Bottom sheet with spring physics (damping ratio + response, Apple-style) */
const sheet = $("#sheet"), scrim = $("#scrim"), body = $("#sheetBody");
const RM = matchMedia("(prefers-reduced-motion: reduce)");
let y = 0, v = 0, H = 0, target = 0, raf = 0, spring = { d: 1, r: 0.35 }, onRest = null, isOpen = false, lastFocus = null;
const apply = () => {
  const vis = y < 0 ? -rubber(-y, H) : y;
  sheet.style.transform = `translateY(${vis}px)`;
  scrim.style.opacity = Math.max(0, Math.min(1, 1 - y / H));
};
function rubber(o, dim, c = 0.55) { return (o * dim * c) / (dim + c * Math.abs(o)); }
function animateTo(t, cfg, done) {
  target = t; spring = cfg; onRest = done; cancelAnimationFrame(raf);
  if (RM.matches) { y = t; v = 0; sheet.style.transition = "opacity 200ms"; apply(); onRest && onRest(); return; }
  let last = performance.now();
  const k = Math.pow(2 * Math.PI / cfg.r, 2), c = 4 * Math.PI * cfg.d / cfg.r;
  const step = now => {
    let dt = Math.min(0.064, (now - last) / 1000); last = now;
    while (dt > 0) { const h = Math.min(dt, 1 / 240); v += (-k * (y - target) - c * v) * h; y += v * h; dt -= h; }
    apply();
    if (Math.abs(v) < 4 && Math.abs(y - target) < 0.5) { y = target; v = 0; apply(); onRest && onRest(); return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
function openSheet(html, from) {
  body.innerHTML = html; body.scrollTop = 0; lastFocus = from || document.activeElement;
  sheet.style.visibility = "visible"; scrim.style.pointerEvents = "auto";
  H = sheet.getBoundingClientRect().height + 40;
  if (!isOpen) { y = H; v = 0; }
  isOpen = true; document.documentElement.style.overflow = "hidden";
  animateTo(0, { d: 1, r: 0.38 });
  sheet.setAttribute("tabindex", "-1"); sheet.focus({ preventScroll: true });
}
function closeSheet(vel = 0) {
  isOpen = false; v = vel;
  animateTo(H, { d: 1, r: 0.32 }, () => { sheet.style.visibility = "hidden"; scrim.style.pointerEvents = "none"; document.documentElement.style.overflow = ""; lastFocus && lastFocus.focus && lastFocus.focus({ preventScroll: true }); });
}
scrim.addEventListener("pointerdown", () => closeSheet());
addEventListener("keydown", e => { if (e.key === "Escape" && isOpen) closeSheet(); });

// Drag: 1:1 tracking from the grab offset, velocity handoff, momentum projection
const grab = $("#grab"); let drag = null;
grab.addEventListener("pointerdown", e => {
  cancelAnimationFrame(raf);            // interrupt: start from the live value
  grab.setPointerCapture(e.pointerId);
  drag = { startY: e.clientY, startPos: y, hist: [[e.timeStamp, e.clientY]] };
});
grab.addEventListener("pointermove", e => {
  if (!drag) return;
  y = drag.startPos + (e.clientY - drag.startY);
  drag.hist.push([e.timeStamp, e.clientY]); if (drag.hist.length > 6) drag.hist.shift();
  apply();
});
const release = e => {
  if (!drag) return;
  const h = drag.hist, a = h[0], b = h[h.length - 1];
  const vel = b[0] > a[0] ? (b[1] - a[1]) / ((b[0] - a[0]) / 1000) : 0;
  const project = (iv, d = 0.998) => (iv / 1000) * d / (1 - d);
  const tapped = Math.abs(e.clientY - drag.startY) < 4;
  drag = null;
  if (tapped) return animateTo(0, { d: 1, r: 0.3 });
  const end = y + project(vel);
  if (end > H * 0.45 && vel > -50) closeSheet(vel);
  else { v = vel; animateTo(0, { d: 0.8, r: 0.3 }); }  // drawer spring, bounce only after a gesture
};
grab.addEventListener("pointerup", release);
grab.addEventListener("pointercancel", release);

function openDish(it, from) {
  const ex = it.a.filter(x => state.ex.has(x));
  let h = `<div class="sh-title"><h3 id="shTitle">${it.n}</h3><span class="price">${eur(it.p)}</span></div>`;
  if (it.o) h += `<p class="sh-sub">${it.o}</p>`;
  if (it.t.length) h += `<div class="tags" style="margin-top:10px">${tagHtml(it.t)}</div>`;
  if (it.d) h += `<p class="sh-desc">${it.d}</p>`;
  if (it.cil) h += `<p class="sh-desc" style="margin-top:6px">Coriandolo disponibile su richiesta.</p>`;
  if (it.opts) h += `<div class="sh-block"><p class="sh-label">Formati</p><ul class="opts">${it.opts.map(o => `<li><span>${o[0]}</span><span>${eur(o[1])}</span></li>`).join("")}</ul></div>`;
  h += `<div class="sh-block"><p class="sh-label">Allergeni</p>${it.a.length ? `<div class="a-chips">${it.a.map(x => `<span class="a-chip">${A[x]}</span>`).join("")}</div>` : `<p class="a-none">Nessuno dei 14 allergeni principali dichiarato.</p>`}</div>`;
  if (it.pair) h += `<div class="sh-block"><p class="sh-label">Abbinamento</p><button class="pair" data-go="vini" onclick="closeSheet()"><span style="font-size:1.4rem">🥂</span><span><b>${it.pair.name}</b>${it.pair.note} · ${it.pair.cat} ${eur(it.pair.price)}</span></button></div>`;
  h += `<p class="note">Per allergie o intolleranze chiedi sempre al nostro personale prima di ordinare.</p>`;
  openSheet(h, from);
}

$("#filterBtn").onclick = e => {
  const draw = () => {
    const n = C.reduce((s, c) => s + c.items.filter(match).length, 0);
    body.innerHTML = `<div class="sh-title"><h3 id="shTitle">Filtra il menù</h3></div>
      <div class="sh-block"><p class="sh-label">Escludi allergeni</p><div class="f-grid">${Object.keys(A).map(k => `<button class="toggle ex" data-ex="${k}" aria-pressed="${state.ex.has(k)}">${A[k]}</button>`).join("")}</div></div>
      <div class="sh-block"><p class="sh-label">Mostra solo</p><div class="f-grid">${PREFS.map(p => `<button class="toggle" data-pf="${p}" aria-pressed="${state.pref.has(p)}">${p}</button>`).join("")}</div></div>
      <div class="f-actions"><button class="btn-ghost" data-clear>Azzera</button><button class="btn-primary" data-done>Mostra ${n} ${n === 1 ? "piatto" : "piatti"}</button></div>`;
  };
  body.onclick = ev => {
    const x = ev.target.closest("[data-ex]"), p = ev.target.closest("[data-pf]");
    if (x) { state.ex.has(x.dataset.ex) ? state.ex.delete(x.dataset.ex) : state.ex.add(x.dataset.ex); }
    else if (p) { state.pref.has(p.dataset.pf) ? state.pref.delete(p.dataset.pf) : state.pref.add(p.dataset.pf); }
    else if (ev.target.closest("[data-clear]")) { state.ex.clear(); state.pref.clear(); }
    else if (ev.target.closest("[data-done]")) { body.onclick = null; closeSheet(); return; }
    else return;
    save(); render(); draw();
  };
  openSheet("", e.currentTarget); draw();
};
const _openDish = openDish;
openDish = (it, from) => { body.onclick = null; _openDish(it, from); };

render();
</script>
